[project]
name = "llaverito"
version = "0.1.0"
description = "Bóveda de credenciales con broker MCP: los agentes usan secretos sin verlos."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "psycopg[binary]>=3.2",
  "pydantic-settings>=2.4",
  "email-validator>=2.2",
  "cryptography>=43",
  "argon2-cffi>=23.1",
  "pyjwt>=2.9",
  "httpx>=0.27",
  "asyncssh>=2.17",
  "mcp>=1.12,<2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
llaverito = "llaverito.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/llaverito"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
